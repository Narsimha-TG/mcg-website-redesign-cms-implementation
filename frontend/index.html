<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH/USDC Flash Loan Arbitrage Bot Analytics</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1, h2 { color: #38bdf8; }
        button { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0369a1; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0 15px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; }
        .review-item { border-bottom: 1px solid #334155; padding: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Autonomous ETH/USDC Flash Loan Arbitrage Bot</h1>
        
        <div class="card">
            <h2>Live Analytics Review</h2>
            <div id="analytics">
                <p>Loading analytics...</p>
            </div>
        </div>

        <div class="card">
            <h2>Submit Review</h2>
            <form id="reviewForm">
                <label>User:</label>
                <input type="text" id="user" required>
                <label>Rating (1-5):</label>
                <input type="number" id="rating" min="1" max="5" required>
                <label>Comment:</label>
                <textarea id="comment" required></textarea>
                <button type="submit">Submit Review</button>
            </form>
        </div>

        <div class="card">
            <h2>Reviews List</h2>
            <div id="reviewsList">Loading reviews...</div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        async function fetchAnalytics() {
            try {
                const response = await fetch(`${API_URL}/api/analytics`);
                const data = await response.json();
                document.getElementById('analytics').innerHTML = `
                    <p><strong>Total Reviews:</strong> ${data.total_reviews}</p>
                    <p><strong>Total Arbitrage Executed:</strong> ${data.total_arbitrage_executed}</p>
                    <p><strong>Success Rate:</strong> ${data.success_rate}</p>
                    <p><strong>Total Profit (ETH):</strong> ${data.total_profit_eth}</p>
                `;
            } catch (err) {
                document.getElementById('analytics').innerHTML = `<p style="color: #ef4444;">Error loading analytics</p>`;
            }
        }

        async function fetchReviews() {
            try {
                const response = await fetch(`${API_URL}/api/reviews`);
                const reviews = await response.json();
                const list = document.getElementById('reviewsList');
                if (reviews.length === 0) {
                    list.innerHTML = '<p>No reviews yet.</p>';
                    return;
                }
                list.innerHTML = reviews.map(r => `
                    <div class="review-item">
                        <strong>${r.user}</strong> (Rating: ${r.rating}/5)
                        <p>${r.comment}</p>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('reviewsList').innerHTML = `<p style="color: #ef4444;">Error loading reviews</p>`;
            }
        }

        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('user').value;
            const rating = parseInt(document.getElementById('rating').value);
            const comment = document.getElementById('comment').value;

            await fetch(`${API_URL}/api/reviews`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, rating, comment })
            });

            document.getElementById('reviewForm').reset();
            fetchReviews();
            fetchAnalytics();
        });

        fetchAnalytics();
        fetchReviews();
    </script>
</body>
</html>
