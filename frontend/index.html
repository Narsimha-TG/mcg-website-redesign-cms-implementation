<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Robotics AI Task Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 950: '#020617', 900: '#0f172a', 800: '#1e293b' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-500/20 border border-blue-500/50 flex items-center justify-center text-blue-400">🤖</div>
                <h1 class="font-bold tracking-tight">ROBOTICS AI AUTOMATION ENGINE</h1>
            </div>
            <div class="text-[10px] font-mono text-blue-500 bg-blue-500/10 px-2 py-1 border border-blue-500/20">SYSTEM_OPERATIONAL</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 bg-slate-900 border border-slate-800 p-6">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Real-time Decision Logs</h2>
                <div id="log-stream" class="h-64 overflow-y-auto font-mono text-xs space-y-1 bg-slate-950 p-4 border border-slate-800"></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Robot Control Panel</h2>
                <form id="command-form" class="space-y-4" onsubmit="event.preventDefault();">
                    <input type="text" id="task-input" placeholder="Enter Task Command" class="w-full bg-slate-950 border border-slate-800 p-2 text-sm font-mono focus:border-blue-500 outline-none">
                    <button onclick="executeCommand()" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-3 uppercase tracking-widest transition-all">Execute Task</button>
                </form>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-900 border border-slate-800 p-6">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Efficiency Metrics</h2>
                <div class="text-4xl font-bold text-white" id="score-display">0.00</div>
                <p class="text-xs text-slate-500 mt-1">Current AI Confidence Score</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">System Health</h2>
                <div id="health-status" class="text-emerald-500 font-mono">CHECKING...</div>
            </div>
        </section>
    </main>

    <script>
        async function executeCommand() {
            const command = document.getElementById('task-input').value;
            await fetch('/api/robot/command', { method: 'POST', body: JSON.stringify({ command }) });
            alert('Command Sent to Robotics Controller');
        }
    </script>
</body>
</html>
