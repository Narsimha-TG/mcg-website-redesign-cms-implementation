<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Robinhood Day-Trading Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 border-b border-slate-800 pb-6 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white">Trading Automation Engine</h1>
                <p class="text-emerald-500">Live: U.S. Equities Market Watch</p>
            </div>
            <button id="kill-switch" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition">EMERGENCY KILL SWITCH</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 space-y-6">
                <div class="p-6 rounded-xl bg-slate-900 border border-slate-800">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Live Ticker Feed</h2>
                    <div id="ticker-feed" class="h-64 overflow-y-auto font-mono text-sm text-emerald-400"></div>
                </div>
                <div class="p-6 rounded-xl bg-slate-900 border border-slate-800">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Strategy Performance</h2>
                    <div id="perf-dashboard" class="h-48 flex items-center justify-center text-slate-600">[Performance Metrics Visualization]</div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="p-6 rounded-xl bg-slate-900 border border-slate-800">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">System Health</h2>
                    <div id="health-status" class="font-mono text-xs text-slate-300">Checking /api/v1/health...</div>
                </div>
                <div class="p-6 rounded-xl bg-slate-900 border border-slate-800">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Strategy Control</h2>
                    <button onclick="toggleStrategy()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition">Toggle Auto-Trading</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function toggleStrategy() {
            const res = await fetch('/api/v1/strategy/toggle', { method: 'POST' });
            alert('Strategy state updated');
        }
        
        fetch('/api/v1/health').then(r => r.json()).then(d => {
            document.getElementById('health-status').innerText = JSON.stringify(d, null, 2);
        });

        document.getElementById('kill-switch').addEventListener('click', () => {
            fetch('/api/v1/orders', { method: 'POST', body: JSON.stringify({ action: 'KILL_ALL' }) });
        });
    </script>
</body>
</html>
