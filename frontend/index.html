<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Real Estate Migration Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold">M</div>
                <h1 class="font-semibold tracking-tight">IDX Migration Orchestrator</h1>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-200">SYSTEM READY</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="bg-white p-6 border border-slate-200 shadow-sm rounded-lg">
                <h2 class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Migration Progress</h2>
                <div class="text-3xl font-bold mt-2">4,800</div>
                <div class="w-full bg-slate-100 h-2 mt-3 rounded-full overflow-hidden">
                    <div class="bg-blue-600 h-full w-[45%]"></div>
                </div>
            </div>
            <div class="bg-white p-6 border border-slate-200 shadow-sm rounded-lg">
                <h2 class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Active Workers</h2>
                <div class="text-3xl font-bold mt-2">8</div>
            </div>
            <div class="bg-white p-6 border border-slate-200 shadow-sm rounded-lg">
                <h2 class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Success Rate</h2>
                <div class="text-3xl font-bold mt-2 text-emerald-600">98.2%</div>
            </div>
            <div class="bg-white p-6 border border-slate-200 shadow-sm rounded-lg">
                <h2 class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Failed Entries</h2>
                <div class="text-3xl font-bold mt-2 text-rose-600">12</div>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white border border-slate-200 shadow-sm rounded-lg p-6">
                <h2 class="text-sm font-semibold mb-4">Execution Logs</h2>
                <div id="log-stream" class="h-80 overflow-y-auto bg-slate-900 text-slate-300 p-4 rounded text-xs font-mono"></div>
            </div>
            <div class="bg-white border border-slate-200 shadow-sm rounded-lg p-6">
                <h2 class="text-sm font-semibold mb-4">Control Actions</h2>
                <div class="space-y-3">
                    <button onclick="triggerJob()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Start Migration</button>
                    <button onclick="pauseJob()" class="w-full bg-slate-100 text-slate-700 py-2 rounded hover:bg-slate-200 transition">Pause Process</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        async function triggerJob() {
            await fetch('/api/v1/jobs/start', { method: 'POST' });
            alert('Migration sequence initiated.');
        }
        async function pauseJob() {
            await fetch('/api/v1/jobs/pause', { method: 'POST' });
            alert('Migration paused.');
        }
    </script>
</body>
</html>
