<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Robotics AI Task Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { lavender: { 50: '#E6E6FA', 100: '#DCD0FF', 200: '#C3B1E1' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#E6E6FA] text-slate-800 min-h-screen font-sans">
    <header class="border-b border-slate-300 bg-white/50 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-purple-500/20 border border-purple-500/50 flex items-center justify-center text-purple-700">🤖</div>
                <h1 class="font-bold tracking-tight text-slate-900">ROBOTICS AI AUTOMATION ENGINE</h1>
            </div>
            <div class="text-[10px] font-mono text-purple-700 bg-purple-500/10 px-2 py-1 border border-purple-500/20">SYSTEM_OPERATIONAL</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 bg-white border border-slate-200 p-6 shadow-sm">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Real-time Decision Logs</h2>
                <div id="log-stream" class="h-64 overflow-y-auto font-mono text-xs space-y-1 bg-slate-50 p-4 border border-slate-200"></div>
            </div>
            <div class="bg-white border border-slate-200 p-6 shadow-sm">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Robot Control Panel</h2>
                <form id="command-form" class="space-y-4" onsubmit="event.preventDefault();">
                    <input type="text" id="task-input" placeholder="Enter Task Command" class="w-full bg-white border border-slate-300 p-2 text-sm font-mono focus:border-purple-500 outline-none">
                    <button onclick="executeCommand()" class="w-full bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-3 uppercase tracking-widest transition-all">Execute Task</button>
                </form>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white border border-slate-200 p-6 shadow-sm">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Efficiency Metrics</h2>
                <div class="text-4xl font-bold text-slate-900" id="score-display">0.00</div>
                <p class="text-xs text-slate-500 mt-1">Current AI Confidence Score</p>
            </div>
            <div class="bg-white border border-slate-200 p-6 shadow-sm">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">System Health</h2>
                <div id="health-status" class="text-emerald-600 font-mono">CHECKING...</div>
            </div>
        </section>
    </main>

    <script>
        async function executeCommand() {
            const command = document.getElementById('task-input').value;
            await fetch('/api/reviews', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title: 'Task Execution', status: 'pending', command }) });
            alert('Command Sent to Robotics Controller');
        }
    </script>
</body>
</html>
