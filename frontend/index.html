<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Automation Engineer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000080;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #000066;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        h1, h2 {
            color: #ffffff;
        }
        .section {
            margin-bottom: 20px;
        }
        button {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #00bfff;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            background: #000044;
            border: 1px solid #1e90ff;
            color: white;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Task Automation Engineer</h1>
        <div class="section">
            <h2>Health Check</h2>
            <button onclick="checkHealth()">Check Health</button>
            <p id="health-status"></p>
        </div>
        <div class="section">
            <h2>Analytics</h2>
            <button onclick="getAnalytics()">Get Analytics</button>
            <pre id="analytics-data"></pre>
        </div>
        <div class="section">
            <h2>Reviews</h2>
            <form id="review-form" onsubmit="submitReview(event)">
                <label for="review-text">Review:</label>
                <textarea id="review-text" required></textarea>
                <button type="submit">Submit Review</button>
            </form>
            <button onclick="getReviews()" style="margin-top: 10px;">Load Reviews</button>
            <pre id="reviews-data"></pre>
        </div>
    </div>
    <script>
        async function checkHealth() {
            const res = await fetch('/api/health');
            const data = await res.json();
            document.getElementById('health-status').innerText = JSON.stringify(data);
        }
        async function getAnalytics() {
            const res = await fetch('/api/analytics');
            const data = await res.json();
            document.getElementById('analytics-data').innerText = JSON.stringify(data, null, 2);
        }
        async function getReviews() {
            const res = await fetch('/api/reviews');
            const data = await res.json();
            document.getElementById('reviews-data').innerText = JSON.stringify(data, null, 2);
        }
        async function submitReview(event) {
            event.preventDefault();
            const text = document.getElementById('review-text').value;
            const res = await fetch('/api/reviews', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ review: text })
            });
            const data = await res.json();
            alert('Review submitted: ' + JSON.stringify(data));
            document.getElementById('review-text').value = '';
            getReviews();
        }
    </script>
</body>
</html>
