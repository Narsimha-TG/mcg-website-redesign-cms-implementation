<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Urban Heat GIS Analysis Automation | Wroclaw & Bengaluru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: { light: '#f8fafc', dark: '#0f172a' },
                        card: { light: '#ffffff', dark: '#1e293b' },
                        text: { light: '#1e293b', dark: '#f1f5f9' }
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .theme-transition { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-bg-light text-text-light dark:bg-bg-dark dark:text-text-dark font-sans min-h-screen">
    <div class="max-w-7xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold">Urban Heat GIS Analysis</h1>
                <p class="text-sm opacity-70">Wroclaw & Bengaluru Workflow Automation</p>
            </div>
            <button onclick="document.documentElement.classList.toggle('dark')" class="px-4 py-2 rounded-lg bg-slate-200 dark:bg-slate-700 font-mono text-xs">
                Toggle Theme
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-6 rounded-xl bg-card-light dark:bg-card-dark shadow-sm border border-slate-200 dark:border-slate-700">
                <h2 class="font-bold mb-4">System Status</h2>
                <div id="health-status" class="text-sm font-mono">Checking /api/health...</div>
            </div>
            <div class="p-6 rounded-xl bg-card-light dark:bg-card-dark shadow-sm border border-slate-200 dark:border-slate-700">
                <h2 class="font-bold mb-4">Analytics Feed</h2>
                <div id="analytics-data" class="text-sm font-mono">Loading /api/analytics...</div>
            </div>
        </div>

        <div class="mt-8 p-6 rounded-xl bg-card-light dark:bg-card-dark shadow-sm border border-slate-200 dark:border-slate-700">
            <h2 class="font-bold mb-4">Action Panel</h2>
            <button onclick="submitReview()" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">Submit Analysis Review</button>
        </div>
    </div>

    <script>
        async function submitReview() {
            await fetch('/api/reviews', { method: 'POST', body: JSON.stringify({ status: 'reviewed' }) });
            alert('Review Submitted');
        }
        
        // Initial fetch for health
        fetch('/api/health').then(r => r.json()).then(d => document.getElementById('health-status').innerText = JSON.stringify(d));
    </script>
</body>
</html>
