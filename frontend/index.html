<!DOCTYPE html>
<html lang="" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Automation Engineer - Review Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <div x-data="dashboard()" x-init="init()" class="flex flex-col min-h-screen">
        
        <!-- Navbar / Header -->
        <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-brand-600 text-white p-2 rounded-xl shadow-lg shadow-brand-500/30">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-brand-500 to-indigo-400 bg-clip-text text-transparent">
                        AI Task Automation Engineer
                    </span>
                </div>
                
                <div class="flex items-center space-x-4">
                    <!-- Health Indicator -->
                    <div class="hidden sm:flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-xs font-medium">
                        <span class="w-2 h-2 rounded-full" :class="healthy ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'"></span>
                        <span x-text="healthy ? 'System Operational' : 'System Offline'"></span>
                    </div>

                    <!-- Dark Mode Toggle -->
                    <button @click="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                        <svg x-show="darkMode" class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <svg x-show="!darkMode" class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Dashboard Body -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            
            <!-- stats_summary -->
            <section>
                <h2 class="text-lg font-semibold mb-4 text-slate-800 dark:text-slate-200">Analytics Overview</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
                        <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Reviews</p>
                        <p class="text-3xl font-bold mt-2" x-text="analytics.total_reviews || 0">0</p>
                    </div>
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
                        <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Average Rating</p>
                        <p class="text-3xl font-bold mt-2 text-amber-500" x-text="(analytics.average_rating || 0).toFixed(1)">0.0</p>
                    </div>
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
                        <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Top Hotel</p>
                        <p class="text-xl font-bold mt-2 truncate" x-text="analytics.top_hotel || 'N/A'">N/A</p>
                    </div>
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
                        <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Automation Status</p>
                        <p class="text-xl font-bold mt-2 text-emerald-500">Active</p>
                    </div>
                </div>
            </section>

            <!-- Responsive Dashboard Grid: Form & List -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- review_form -->
                <section class="lg:col-span-1">
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm sticky top-24">
                        <h2 class="text-lg font-semibold mb-4 text-slate-800 dark:text-slate-200">Submit New Review</h2>
                        
                        <form @submit.prevent="submitReview()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Hotel Name</label>
                                <input type="text" x-model="form.hotel_name" required
                                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Author</label>
                                <input type="text" x-model="form.author" required
                                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Rating (1-5)</label>
                                <select x-model.number="form.rating" required
                                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                                    <option value="5">5 - Excellent</option>
                                    <option value="4">4 - Very Good</option>
                                    <option value="3">3 - Average</option>
                                    <option value="2">2 - Poor</option>
                                    <option value="1">1 - Terrible</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Comment</label>
                                <textarea x-model="form.comment" rows="3" required
                                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition"></textarea>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Date</label>
                                <input type="date" x-model="form.date" required
                                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                            </div>

                            <button type="submit"
                                :disabled="submitting"
                                class="w-full bg-brand-600 hover:bg-brand-700 active:scale-[0.98] text-white font-medium py-3 rounded-xl shadow-lg shadow-brand-500/20 transition duration-200 disabled:opacity-50">
                                <span x-show="!submitting">Submit Review</span>
                                <span x-show="submitting">Submitting...</span>
                            </button>

                            <p x-show="feedback" class="text-xs text-center mt-2" :class="feedbackSuccess ? 'text-emerald-500' : 'text-rose-500'" x-text="feedback"></p>
                        </form>
                    </div>
                </section>

                <!-- review_list -->
                <section class="lg:col-span-2">
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-200">Recent Reviews</h2>
                            <button @click="loadData()" class="p-2 text-slate-500 hover:text-brand-500 transition rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                            </button>
                        </div>

                        <div class="space-y-4">
                            <template x-for="review in reviews" :key="review.date + review.author">
                                <div class="border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30 rounded-xl p-4 transition hover:border-brand-500/30">
                                    <div class="flex items-center justify-between mb-2">
                                        <div>
                                            <h3 class="font-semibold text-slate-900 dark:text-slate-100" x-text="review.hotel_name"></h3>
                                            <p class="text-xs text-slate-500">By <span x-text="review.author"></span> on <span x-text="review.date"></span></p>
                                        </div>
                                        <div class="flex items-center space-x-1 bg-amber-500/10 px-2.5 py-1 rounded-lg text-amber-500 text-sm font-semibold">
                                            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.683-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                                            </svg>
                                            <span x-text="review.rating"></span>
                                        </div>
                                    </div>
                                    <p class="text-sm text-slate-600 dark:text-slate-300 mt-2" x-text="review.comment"></p>
                                </div>
                            </template>
                            <div x-show="reviews.length === 0" class="text-center py-12 text-slate-500">
                                <p>No reviews found. Submit one to get started!</p>
                            </div>
                        </div>
                    </div>
                </section>

            </div>

        </main>

        <!-- Footer -->
        <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
            <p>&copy; 2025 AI Task Automation Engineer. Built with FastAPI, Python, Java & Tailwind CSS.</p>
        </footer>
    </div>

    <script>
        function dashboard() {
            return {
                darkMode: true,
                healthy: false,
                analytics: {},
                reviews: [],
                submitting: false,
                feedback: '',
                feedbackSuccess: false,
                form: {
                    hotel_name: '',
                    author: '',
                    rating: 5,
                    comment: '',
                    date: new Date().toISOString().split('T')[0]
                },
                init() {
                    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                        this.darkMode = false;
                        document.documentElement.classList.remove('dark');
                    } else {
                        this.darkMode = true;
                        document.documentElement.classList.add('dark');
                    }
                    this.loadData();
                },
                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                        localStorage.theme = 'dark';
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.theme = 'light';
                    }
                },
                async loadData() {
                    try {
                        const healthRes = await fetch('/api/health');
                        this.healthy = healthRes.ok;

                        const analyticsRes = await fetch('/api/analytics');
                        if (analyticsRes.ok) {
                            this.analytics = await analyticsRes.json();
                        }

                        const reviewsRes = await fetch('/api/reviews');
                        if (reviewsRes.ok) {
                            this.reviews = await reviewsRes.json();
                        }
                    } catch (e) {
                        console.error('API connection error:', e);
                        this.healthy = false;
                    }
                },
                async submitReview() {
                    this.submitting = true;
                    this.feedback = '';
                    try {
                        const res = await fetch('/api/reviews', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.form)
                        });
                        if (res.ok) {
                            this.feedback = 'Review submitted successfully!';
                            this.feedbackSuccess = true;
                            this.form.hotel_name = '';
                            this.form.author = '';
                            this.form.comment = '';
                            this.form.rating = 5;
                            this.form.date = new Date().toISOString().split('T')[0];
                            await this.loadData();
                        } else {
                            this.feedback = 'Failed to submit review.';
                            this.feedbackSuccess = false;
                        }
                    } catch (e) {
                        this.feedback = 'Network error occurred.';
                        this.feedbackSuccess = false;
                    } finally {
                        this.submitting = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
