<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>AdSense Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 950: '#020617', 900: '#0f172a', 800: '#1e293b' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center text-emerald-400">👁️</div>
                <h1 class="font-bold tracking-tight">AD-VIEW AUTOMATION ENGINE</h1>
            </div>
            <div class="text-[10px] font-mono text-emerald-500 bg-emerald-500/10 px-2 py-1 border border-emerald-500/20">SYSTEM_ACTIVE</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="md:col-span-3 bg-slate-900 border border-slate-800 p-6">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Task Queue & Proxy Status</h2>
                <div id="task-list" class="space-y-2">
                    <div class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800">
                        <span class="font-mono text-sm">TASK_ID: YT-AD-9921</span>
                        <span class="text-emerald-500 text-xs">COMPLETED_SUCCESS</span>
                    </div>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Dispatch Control</h2>
                <form id="dispatch-form" class="space-y-4" onsubmit="event.preventDefault();">
                    <input type="text" id="video-url" placeholder="Target Video URL" class="w-full bg-slate-950 border border-slate-800 p-2 text-sm font-mono focus:border-emerald-500 outline-none">
                    <button onclick="enqueueTask()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-3 uppercase tracking-widest transition-all">Enqueue Task</button>
                </form>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-900 border border-slate-800 p-6">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Analytics Summary</h2>
                <div class="text-4xl font-bold text-white">984 / 1000</div>
                <p class="text-xs text-slate-500 mt-1">Daily Ad Completion Target</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6">
                <h2 class="text-xs font-mono text-slate-500 mb-4 uppercase">Proxy Health Heatmap</h2>
                <div class="flex gap-1 h-8">
                    <div class="w-full bg-emerald-500"></div>
                    <div class="w-full bg-emerald-500"></div>
                    <div class="w-full bg-amber-500"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        async function enqueueTask() {
            const video_url = document.getElementById('video-url').value;
            await fetch('/api/v1/tasks/enqueue', { method: 'POST', body: JSON.stringify({ video_url }) });
            alert('Task Enqueued Successfully');
        }
    </script>
</body>
</html>
