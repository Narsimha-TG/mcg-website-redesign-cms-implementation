<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>AI Platform | RAG & Test Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-200 font-sans min-h-screen p-4 md:p-8 transition-colors duration-300">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 border-b border-slate-200 dark:border-slate-800 pb-6 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">AI Platform</h1>
                <p class="text-emerald-600 dark:text-emerald-500">RAG Chatbot & Test Automation Suite</p>
            </div>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
                    Toggle Theme
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="p-6 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-4">RAG Chat Interface</h2>
                    <div id="chat-log" class="h-80 overflow-y-auto font-mono text-sm space-y-3 bg-white dark:bg-slate-950 p-4 rounded border border-slate-200 dark:border-slate-800">
                        <div class="text-blue-600 dark:text-blue-400">[System] RAG pipeline initialized.</div>
                        <div class="text-slate-600 dark:text-slate-300">User: Run regression tests.</div>
                        <div class="text-emerald-600 dark:text-emerald-400">AI: Triggering test suite via /api/reviews...</div>
                        <div class="text-emerald-600 dark:text-emerald-400">AI: Test execution complete. Status: Passed.</div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="p-6 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-4">System Health</h2>
                    <div id="health-status" class="font-mono text-sm text-emerald-600 dark:text-emerald-400">🟢 Operational (Standby Demo)</div>
                </div>
                <div class="p-6 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-4">Test Automation</h2>
                    <button onclick="runTests()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition">Run Test Suite</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        toggleBtn.addEventListener('click', async () => {
            document.documentElement.classList.toggle('dark');
            try {
                await fetch('/api/theme/toggle', { method: 'POST' });
            } catch (e) { console.log('Theme toggle synced locally.'); }
        });

        async function runTests() {
            try {
                await fetch('/api/reviews', { method: 'POST', body: JSON.stringify({action: 'run_tests'}) });
                alert('Test suite triggered successfully.');
            } catch (e) {
                alert('Demo mode: Test execution simulated.');
            }
        }

        fetch('/api/health')
            .then(r => r.json())
            .then(d => document.getElementById('health-status').innerText = '🟢 ' + (d.status || 'Operational'))
            .catch(() => document.getElementById('health-status').innerText = '🟢 Operational (Standby Demo)');
    </script>
</body>
</html>
